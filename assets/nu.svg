<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="body" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </radialGradient>
    <radialGradient id="leaf" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </radialGradient>
  </defs>
  <!-- glow -->
  <circle cx="60" cy="66" r="42" fill="#10B981" opacity="0.18"/>
  <!-- leaves on top -->
  <ellipse cx="52" cy="24" rx="10" ry="16" fill="url(#leaf)" transform="rotate(-25 52 24)"/>
  <ellipse cx="68" cy="24" rx="10" ry="16" fill="url(#leaf)" transform="rotate(25 68 24)"/>
  <!-- body -->
  <circle cx="60" cy="66" r="34" fill="url(#body)"/>
  <!-- highlight -->
  <ellipse cx="48" cy="52" rx="10" ry="7" fill="#FFFFFF" opacity="0.35"/>
  <!-- eyes -->
  <circle cx="50" cy="66" r="3" fill="#0F172A"/>
  <circle cx="70" cy="66" r="3" fill="#0F172A"/>
  <!-- smile -->
  <path d="M 50 78 Q 60 86 70 78" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
